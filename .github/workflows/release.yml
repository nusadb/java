name: Release

# Publishes five artifacts to Maven Central via the Sonatype Central Portal:
#   com.nusadb:nusadb-jdbc
#   com.nusadb:nusadb-hibernate5
#   com.nusadb:nusadb-hibernate6
#   com.nusadb:nusadb-spring-boot-starter
#   com.nusadb:nusadb-bom
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The version lives in one place, the `revision` property of the root pom (X.Y.Z-SNAPSHOT
# between releases). A release builds with -Drevision=X.Y.Z, and flatten-maven-plugin writes
# that into every published pom. The parent pom and test-support are never published.
#
# The driver is deployed FIRST and with <waitUntil>published</waitUntil>: the dialects and the
# BOM reference com.nusadb:nusadb-jdbc, so it has to be resolvable on Central before artifacts
# referencing it are validated.
#
# Required secrets:
#   MAVEN_CENTRAL_USERNAME  -- Central Portal user token name
#   MAVEN_CENTRAL_PASSWORD  -- Central Portal user token password
#   GPG_PRIVATE_KEY         -- ASCII-armoured private key (gpg --armor --export-secret-keys KEYID)
#   GPG_PASSPHRASE          -- that key's passphrase
#
# One-time setup: the `com.nusadb` namespace must be verified at central.sonatype.com, and
# the public half of the GPG key must be pushed to a keyserver (e.g. keyserver.ubuntu.com),
# or Central will reject the signatures.

#
# Maven Central is immutable: a coordinate that has been published can never be redeployed.
# A release that dies partway therefore cannot simply be re-run -- the modules that already
# made it through would fail with "version already exists" and block the ones that did not.
# So each module is skipped if its version is already on Central, which makes this workflow
# resumable, and it can be dispatched by hand to finish a partial release.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Re-run against a branch to finish a release that failed partway. There is no tag, so the
  # version to (re)publish is given here. No GitHub Release is cut.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.2.0 (must match the root pom revision without -SNAPSHOT)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # Writes a settings.xml whose <server><id> is `central`, matching
          # <publishingServerId> in the release profile of the root pom.
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # The version comes from the tag (or the dispatch input) and must match the root pom's
      # `revision`, give or take -SNAPSHOT -- so a tag cannot ship code that was being developed
      # towards a different version.
      - name: Resolve and verify the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, sys, xml.etree.ElementTree as ET

          NS = {"m": "http://maven.apache.org/POM/4.0.0"}
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              expected = os.environ["GITHUB_REF_NAME"].lstrip("v")
              source = "the tag"
          else:
              expected = os.environ["INPUT_VERSION"].strip()
              source = "the dispatch input"

          if not re.fullmatch(r"\d+\.\d+\.\d+", expected):
              print(f"::error::{source} gives version '{expected}', expected X.Y.Z")
              sys.exit(1)

          revision = ET.parse("pom.xml").getroot().findtext("m:properties/m:revision", namespaces=NS)
          if revision.removesuffix("-SNAPSHOT") != expected:
              print(f"::error::pom.xml revision is {revision}, but {source} says {expected}")
              sys.exit(1)

          print(f"publishing {expected} (from {source}; pom revision {revision})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={expected}\n")
          PY

      # A module already on Central cannot be redeployed, so skip it instead of failing.
      # This reads repo1 rather than the Portal API: repo1 is the thing consumers resolve
      # against, and a 200 there means the coordinate is spent for good.
      #
      # Note the Portal takes a little while to sync a freshly published artifact to repo1, so
      # a module published minutes ago may still 404 here. That is safe -- the deploy is simply
      # attempted and Central rejects it -- but it is why a failed release is worth re-running
      # after a short wait rather than immediately.
      - name: Check what is already on Central
        id: central
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # artifactId -> module directory
          declare -A modules=(
            [nusadb-jdbc]=nusadb-jdbc
            [nusadb-hibernate5]=hibernate5
            [nusadb-hibernate6]=hibernate6
            [nusadb-spring-boot-starter]=spring-boot-starter
            [nusadb-bom]=bom
          )
          rest=()
          for artifact in nusadb-jdbc nusadb-hibernate5 nusadb-hibernate6 nusadb-spring-boot-starter nusadb-bom; do
            url="https://repo1.maven.org/maven2/com/nusadb/$artifact/$VERSION/$artifact-$VERSION.pom"
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$url")
            case "$code" in
              200) state=published ;;
              404) state=absent ;;
              *)   echo "::error::unexpected HTTP $code from $url"; exit 1 ;;
            esac
            echo "$artifact $VERSION -> $state"
            if [ "$artifact" = nusadb-jdbc ]; then
              echo "driver=$state" >> "$GITHUB_OUTPUT"
            elif [ "$state" = absent ]; then
              rest+=("${modules[$artifact]}")
            fi
          done
          # Comma-separated module list for `mvn -pl`, empty when everything is out already.
          (IFS=,; echo "rest=${rest[*]}") >> "$GITHUB_OUTPUT"

      # -DskipTests: CI already ran the unit and integration tests on this commit; the release
      # job has no Docker-backed server to run them against again.
      #
      # -am builds what the driver needs from the reactor (the parent, test-support); the
      # release profile excludes both from the Central bundle, so only nusadb-jdbc is uploaded.
      # `deploy` runs `install` first, which puts the parent and the driver in the local
      # repository for the next step.
      - name: Deploy the JDBC driver
        if: steps.central.outputs.driver == 'absent'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.version.outputs.version }}
        run: mvn -B -ntp -Prelease -DskipTests -Drevision="$VERSION" -pl nusadb-jdbc -am deploy

      # When the driver was published by an earlier, partial run, the step above was skipped,
      # so the parent and test-support (which the dialects' tests compile against) are not in
      # the local repository yet. Install them; nothing is uploaded.
      - name: Install the build-only modules locally
        if: steps.central.outputs.driver == 'published' && steps.central.outputs.rest != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: mvn -B -ntp -DskipTests -Drevision="$VERSION" -pl test-support -am install

      # Without -am: the driver comes from Central (or the local repository), so it is not
      # rebuilt into this bundle and uploaded a second time.
      - name: Deploy the dialects, the starter and the BOM
        if: steps.central.outputs.rest != ''
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          VERSION: ${{ steps.version.outputs.version }}
          MODULES: ${{ steps.central.outputs.rest }}
        run: mvn -B -ntp -Prelease -DskipTests -Drevision="$VERSION" -pl "$MODULES" deploy

  # Only a tag names a release, so a manual dispatch finishing a partial publish does not
  # try to cut one.
  github-release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
