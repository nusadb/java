name: CI

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit tests only (no server): `mvn verify` leaves the *IT integration tests skipped.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # One reactor build: the parent orders the modules (driver before the dialects that depend
      # on it), so nothing has to be installed by hand first.
      - name: Build and unit-test every module
        run: mvn -B -ntp verify

      - name: Verify the packaged driver jar registers itself
        run: |
          jar="$(find nusadb-jdbc/target -maxdepth 1 -name 'nusadb-jdbc-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          echo "driver jar: $jar"
          # DriverManager must find NusaDriver via the ServiceLoader / JDBC autoloading from the
          # jar alone, and it must claim the jdbc:nusadb: URL scheme.
          cat > /tmp/CheckDriver.java <<'EOF'
          import java.sql.Driver;
          import java.sql.DriverManager;
          public class CheckDriver {
              public static void main(String[] args) throws Exception {
                  Driver d = DriverManager.getDriver("jdbc:nusadb://localhost:5432/db");
                  if (d == null) throw new IllegalStateException("no driver registered for jdbc:nusadb:");
                  if (!d.acceptsURL("jdbc:nusadb://localhost:5432/db")) {
                      throw new IllegalStateException(d + " does not accept the jdbc:nusadb: scheme");
                  }
                  System.out.println("registered: " + d.getClass().getName()
                      + " v" + d.getMajorVersion() + "." + d.getMinorVersion());
              }
          }
          EOF
          java -cp "$jar" /tmp/CheckDriver.java

  # Integration tests against a real server. test-support (NusaTestServer) starts the
  # nusadb/nusadb image through Testcontainers, using the runner's Docker.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Integration tests (Testcontainers)
        run: mvn -B -ntp verify -Pit

  # A release signs and uploads from these same poms. Catch a pom that Central would reject
  # (missing scm/developers/licenses, a javadoc build that dies) here, on every push, rather
  # than discovering it at tag time.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build the release artifacts (unsigned)
        # -Dgpg.skip: no signing key on a PR build; everything else in the release profile
        # (sources jar, javadoc jar, flattened poms) is exercised for real.
        run: mvn -B -ntp -Prelease -Dgpg.skip -DskipTests install

      - name: Confirm sources and javadoc jars were produced
        run: |
          missing=0
          for dir in nusadb-jdbc hibernate5 hibernate6; do
            for kind in sources javadoc; do
              if ! ls "$dir"/target/*-"$kind".jar >/dev/null 2>&1; then
                echo "::error::$dir is missing its -$kind.jar (Maven Central requires it)"
                missing=1
              fi
            done
          done
          exit $missing

      - name: Confirm the published poms are self-contained
        run: |
          # Consumers (and Central) only ever see the flattened poms: no <parent> (the parent is
          # never published) and no unresolved ${...} versions.
          bad=0
          for dir in nusadb-jdbc hibernate5 hibernate6 bom; do
            pom="$dir/.flattened-pom.xml"
            if grep -q '<parent>' "$pom"; then
              echo "::error::$pom still references a parent"; bad=1
            fi
            if grep -q '\${' "$pom"; then
              echo "::error::$pom has an unresolved property"; bad=1
            fi
          done
          exit $bad
